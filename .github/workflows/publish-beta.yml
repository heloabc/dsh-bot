name: Publish beta

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: npm-beta
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Use an npm CLI that supports trusted publishing
        run: npm install --global npm@^11.5.1

      - name: Install
        run: |
          npm ci
          npm ci --prefix ui

      - name: Test
        run: npm test

      - name: Build
        run: |
          npm run build
          npm run build --prefix ui

      - name: Set the next 0.1.0 beta
        run: node .github/next-beta-version.mjs

      - name: Publish
        run: npm publish --tag beta --access public
